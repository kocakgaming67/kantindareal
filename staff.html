<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Staff Kantin - Firebase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .stat-card {
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(249, 115, 22, 0.2);
    }

    .pulse-dot {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .order-card {
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tab-active {
      border-bottom: 3px solid #f97316;
      color: #f97316;
      background: linear-gradient(to bottom, rgba(249, 115, 22, 0.05), transparent);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: white;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      display: none;
      z-index: 1000;
      animation: slideInRight 0.3s ease-out;
    }

    @keyframes slideInRight {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
 </head>
 <body class="bg-gradient-to-br from-gray-50 to-orange-50 font-sans">
  <!-- Header -->
  <header class="bg-white shadow-lg sticky top-0 z-50 border-b border-orange-100">
   <div class="max-w-7xl mx-auto px-6 py-5">
    <div class="flex justify-between items-center">
     <div class="flex items-center space-x-4">
      <div class="w-12 h-12 bg-gradient-to-br from-orange-500 to-orange-600 rounded-xl flex items-center justify-center shadow-md">
       <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
       </svg>
      </div>
      <div>
       <h1 class="text-2xl font-bold text-gray-800">Dashboard Staff Kantin</h1>
       <p class="text-xs text-gray-500">Powered by Firebase 🔥</p>
      </div>
     </div>
     <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-2 bg-gray-100 px-4 py-2 rounded-lg">
       <div class="w-3 h-3 rounded-full pulse-dot" id="connectionStatus"></div><span class="text-sm font-medium" id="statusText">Terputus</span>
      </div>
      <div class="text-right">
       <p class="text-sm text-gray-500" id="currentTime"></p>
      </div>
     </div>
    </div>
   </div>
  </header>
  <main class="max-w-7xl mx-auto px-4 py-6">
   <!-- Stats Cards -->
   <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-6">
    <div class="stat-card bg-white rounded-xl shadow-md p-5">
     <div class="flex items-start justify-between mb-3">
      <div class="w-10 h-10 bg-yellow-100 rounded-lg flex items-center justify-center">
       <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
       </svg>
      </div>
     </div>
     <p class="text-sm text-gray-600 font-medium mb-1">Pesanan Baru</p>
     <p id="pendingCount" class="text-3xl font-bold text-gray-800">0</p>
    </div>
    <div class="stat-card bg-white rounded-xl shadow-md p-5">
     <div class="flex items-start justify-between mb-3">
      <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
       <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
       </svg>
      </div>
     </div>
     <p class="text-sm text-gray-600 font-medium mb-1">Sedang Diproses</p>
     <p id="processingCount" class="text-3xl font-bold text-gray-800">0</p>
    </div>
    <div class="stat-card bg-white rounded-xl shadow-md p-5">
     <div class="flex items-start justify-between mb-3">
      <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
       <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
       </svg>
      </div>
     </div>
     <p class="text-sm text-gray-600 font-medium mb-1">Siap Diambil</p>
     <p id="readyCount" class="text-3xl font-bold text-gray-800">0</p>
    </div>
    <div class="stat-card bg-gradient-to-br from-orange-500 to-orange-600 rounded-xl shadow-md p-5">
     <div class="flex items-start justify-between mb-3">
      <div class="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center"><span class="text-white font-bold text-lg">Rp</span>
      </div>
     </div>
     <p class="text-sm text-orange-100 font-medium mb-1">Total Hari Ini</p>
     <p id="totalRevenue" class="text-3xl font-bold text-white">Rp 0</p>
    </div>
   </div>
   <!-- Tabs -->
   <div class="bg-white rounded-xl shadow-md mb-6">
    <div class="flex border-b border-gray-200"><button onclick="switchTab('orders')" id="ordersTab" class="flex-1 px-6 py-4 font-semibold text-gray-700 hover:bg-gray-50 transition-all tab-active flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
      </svg> Kelola Pesanan </button> <button onclick="switchTab('menu')" id="menuTab" class="flex-1 px-6 py-4 font-semibold text-gray-700 hover:bg-gray-50 transition-all flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
      </svg> Kelola Menu </button>
    </div>
   </div>
   <!-- Orders Section -->
   <div id="ordersSection">
    <div class="bg-white rounded-xl shadow-md p-5 mb-6">
     <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
       <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
       </svg><span class="text-sm font-semibold text-gray-700">Filter Status</span>
      </div><button onclick="refreshOrders()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg font-semibold text-sm transition-all flex items-center gap-2">
       <svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
       </svg> Refresh </button>
     </div>
     <div class="flex flex-wrap gap-2 mt-4"><button onclick="filterOrders('all')" class="filter-btn bg-gradient-to-r from-orange-500 to-orange-600 text-white px-5 py-2.5 rounded-lg font-semibold hover:from-orange-600 hover:to-orange-700 transition-all text-sm shadow-md"> Semua </button> <button onclick="filterOrders('pending')" class="filter-btn bg-white text-gray-700 px-5 py-2.5 rounded-lg font-semibold hover:bg-gray-50 transition-all text-sm border border-gray-200"> Baru </button> <button onclick="filterOrders('processing')" class="filter-btn bg-white text-gray-700 px-5 py-2.5 rounded-lg font-semibold hover:bg-gray-50 transition-all text-sm border border-gray-200"> Diproses </button> <button onclick="filterOrders('ready')" class="filter-btn bg-white text-gray-700 px-5 py-2.5 rounded-lg font-semibold hover:bg-gray-50 transition-all text-sm border border-gray-200"> Siap </button> <button onclick="filterOrders('completed')" class="filter-btn bg-white text-gray-700 px-5 py-2.5 rounded-lg font-semibold hover:bg-gray-50 transition-all text-sm border border-gray-200"> Selesai </button>
     </div>
    </div>
    <div id="ordersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
     <div class="col-span-full text-center py-12">
      <p class="text-gray-500 text-lg">Hubungkan Firebase untuk melihat pesanan</p>
     </div>
    </div>
   </div>
   <!-- Menu Section -->
   <div id="menuSection" class="hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="menuList">
     <div class="col-span-full text-center py-12">
      <p class="text-gray-500 text-lg">Hubungkan Firebase untuk melihat menu</p>
     </div>
    </div>
   </div>
  </main>
  <!-- Toast Notification -->
  <div id="toast" class="toast">
   <div class="flex items-center space-x-3">
    <div id="toastIcon"></div>
    <p id="toastMessage" class="font-semibold text-gray-800"></p>
   </div>
  </div>
  <script>
    // ============================================
    // FIREBASE CONFIGURATION SLOT
    // ============================================
    // TODO: Masukkan kredensial Firebase Anda di sini
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY_HERE",
      authDomain: "YOUR_AUTH_DOMAIN_HERE",
      projectId: "YOUR_PROJECT_ID_HERE",
      storageBucket: "YOUR_STORAGE_BUCKET_HERE",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID_HERE",
      appId: "YOUR_APP_ID_HERE"
    };

    // TODO: Initialize Firebase
    // Uncomment dan sesuaikan dengan versi Firebase yang Anda gunakan
    // 
    // import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    // import { getFirestore, collection, getDocs, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    // 
    // const app = initializeApp(firebaseConfig);
    // const db = getFirestore(app);
    // ============================================

    let isConnected = false;
    let currentOrderFilter = 'all';
    let currentTab = 'orders';

    // Menu data
    const menuData = [
      { id: 1, name: 'Bakwan', category: 'snack', price: 1000 },
      { id: 2, name: 'Dayaki', category: 'snack', price: 1000 },
      { id: 3, name: 'Pop Mie', category: 'snack', price: 7000 },
      { id: 4, name: 'Klepon', category: 'snack', price: 2000 },
      { id: 5, name: 'Nabati', category: 'snack', price: 2000 },
      { id: 13, name: 'Roti Beta', category: 'snack', price: 1000, variants: ['Moka', 'Cream', 'Kompiang', 'Kacang Hijau'] },
      { id: 18, name: 'Golda Coffee', category: 'minuman', price: 5000 },
      { id: 23, name: 'Teh Pucuk', category: 'minuman', price: 5000 },
      { id: 25, name: 'Air Putih', category: 'minuman', price: 1000 }
    ];

    // Update time
    function updateTime() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      const dateString = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' });
      document.getElementById('currentTime').textContent = `${timeString} - ${dateString}`;
    }

    // Show toast notification
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');
      
      const icons = {
        success: '<svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
        error: '<svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
        info: '<svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'
      };
      
      toastIcon.innerHTML = icons[type] || icons.info;
      toastMessage.textContent = message;
      toast.style.display = 'block';
      
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }

    // Update connection status
    function updateConnectionStatus(connected) {
      isConnected = connected;
      const statusDot = document.getElementById('connectionStatus');
      const statusText = document.getElementById('statusText');
      
      if (connected) {
        statusDot.className = 'w-3 h-3 rounded-full pulse-dot bg-green-500';
        statusText.textContent = 'Terhubung';
        statusText.className = 'text-sm font-medium text-green-600';
      } else {
        statusDot.className = 'w-3 h-3 rounded-full bg-red-500';
        statusText.textContent = 'Terputus';
        statusText.className = 'text-sm font-medium text-red-600';
      }
    }

    // Initialize Firebase connection
    function initializeFirebase() {
      // dummy visual: if you didn't add actual init, we keep sample.
      try {
        if (firebaseConfig.apiKey === "YOUR_API_KEY_HERE") {
          console.log("⚠️ Firebase belum dikonfigurasi pada blok placeholder (dilewati karena kita pakai modul di bawah).");
          return;
        }
      } catch(e) {}
    }

    // Load data from Firebase (dummy placeholder kept)
    function loadSampleData() {
      const emptyOrders = [];
      renderOrders(emptyOrders);
      updateStats(emptyOrders);
      renderMenu();
    }

    // Render orders
    function renderOrders(orders) {
      const container = document.getElementById('ordersList');
      
      if (!orders || orders.length === 0) {
        container.innerHTML = '<div class="col-span-full text-center py-12"><p class="text-gray-500 text-lg">Tidak ada pesanan</p></div>';
        return;
      }
      
      const filteredOrders = currentOrderFilter === 'all' 
        ? orders 
        : orders.filter(order => order.status === currentOrderFilter);
      
      container.innerHTML = '';
      
      filteredOrders.forEach(order => {
        const statusColors = {
          'pending': 'bg-yellow-50 border-yellow-300',
          'processing': 'bg-blue-50 border-blue-300',
          'ready': 'bg-green-50 border-green-300',
          'completed': 'bg-gray-50 border-gray-300'
        };
        
        const statusTexts = {
          'pending': 'Pesanan Baru',
          'processing': 'Sedang Diproses',
          'ready': 'Siap Diambil',
          'completed': 'Selesai'
        };
        
        const orderCard = document.createElement('div');
        orderCard.className = `order-card ${statusColors[order.status]} border-2 rounded-xl p-4`;
        
        const itemsList = (order.items || []).map(item => 
          `<div class="text-sm text-gray-700">${item.name}${item.variant ? ` (${item.variant})` : ''} x${item.quantity}</div>`
        ).join('');
        
        orderCard.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <div>
              <span class="font-bold text-gray-800">${order.orderId}</span>
              <p class="text-xs text-gray-500">${new Date(order.timestamp).toLocaleString('id-ID')}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-semibold ${order.status === 'pending' ? 'bg-yellow-200 text-yellow-800' : order.status === 'processing' ? 'bg-blue-200 text-blue-800' : order.status === 'ready' ? 'bg-green-200 text-green-800' : 'bg-gray-200 text-gray-800'}">
              ${statusTexts[order.status]}
            </span>
          </div>
          
          <div class="mb-3">
            <p class="font-semibold text-gray-800">${order.studentName}</p>
            <p class="text-sm text-gray-600">${order.studentClass}</p>
          </div>
          
          <div class="mb-3">
            ${itemsList}
          </div>
          
          <div class="border-t pt-3 mb-3">
            <div class="flex justify-between items-center">
              <span class="font-semibold text-gray-700">Total:</span>
              <span class="text-xl font-bold text-orange-600">Rp ${Number(order.totalPrice||0).toLocaleString('id-ID')}</span>
            </div>
          </div>
          
          <button onclick="updateOrderStatus('${order.orderId}')" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-2 rounded-lg font-semibold text-sm transition-colors">
            Update Status
          </button>
        `;
        
        container.appendChild(orderCard);
      });
    }

    // Render menu
    function renderMenu() {
      const container = document.getElementById('menuList');
      container.innerHTML = '';
      
      menuData.forEach(item => {
        const menuCard = document.createElement('div');
        menuCard.className = 'bg-white rounded-xl shadow-md p-4 hover:shadow-lg transition-shadow';
        
        menuCard.innerHTML = `
          <div class="flex items-start justify-between mb-3">
            <div>
              <h3 class="font-bold text-gray-800">${item.name}</h3>
              <p class="text-sm text-orange-600 font-semibold">Rp ${item.price.toLocaleString('id-ID')}</p>
            </div>
            <span class="bg-green-500 text-white px-3 py-1 rounded-full text-xs font-bold">TERSEDIA</span>
          </div>
          
          <button onclick="toggleStock(${item.id})" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg font-semibold transition-colors">
            Tandai Habis
          </button>
        `;
        
        container.appendChild(menuCard);
      });
    }

    // Update stats
    function updateStats(orders) {
      if (!orders) return;
      
      const pending = orders.filter(o => o.status === 'pending').length;
      const processing = orders.filter(o => o.status === 'processing').length;
      const ready = orders.filter(o => o.status === 'ready').length;
      const total = orders.reduce((sum, o) => sum + Number(o.totalPrice||0), 0);
      
      document.getElementById('pendingCount').textContent = pending;
      document.getElementById('processingCount').textContent = processing;
      document.getElementById('readyCount').textContent = ready;
      document.getElementById('totalRevenue').textContent = `Rp ${total.toLocaleString('id-ID')}`;
    }

    // Filter orders
    function filterOrders(status) {
      currentOrderFilter = status;
      showToast(`Filter: ${status}`, 'info');
      
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-gradient-to-r', 'from-orange-500', 'to-orange-600', 'text-white', 'shadow-md');
        btn.classList.add('bg-white', 'text-gray-700', 'border', 'border-gray-200');
      });
      
      event.target.classList.remove('bg-white', 'text-gray-700', 'border', 'border-gray-200');
      event.target.classList.add('bg-gradient-to-r', 'from-orange-500', 'to-orange-600', 'text-white', 'shadow-md');
    }

    // Refresh orders
    function refreshOrders() {
      showToast('Memuat ulang pesanan...', 'info');
      setTimeout(() => {
        showToast('Pesanan berhasil dimuat ulang!', 'success');
      }, 600);
    }

    // Placeholder update/toggle (ditimpa oleh script Firebase module di bawah)
    function updateOrderStatus(orderId) { showToast(`Pesanan ${orderId} diperbarui!`, 'success'); }
    function toggleStock(itemId) { showToast('Status stok diperbarui!', 'success'); }

    // Switch tab
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('#ordersTab, #menuTab').forEach(btn => btn.classList.remove('tab-active'));
      if (tab === 'orders') {
        document.getElementById('ordersTab').classList.add('tab-active');
        document.getElementById('ordersSection').classList.remove('hidden');
        document.getElementById('menuSection').classList.add('hidden');
      } else {
        document.getElementById('menuTab').classList.add('tab-active');
        document.getElementById('ordersSection').classList.add('hidden');
        document.getElementById('menuSection').classList.remove('hidden');
      }
    }

    // Initialize application
    updateTime();
    setInterval(updateTime, 1000);
    initializeFirebase(); // keeps your original flow
  </script>

  <!-- === Firebase REAL hookup (added) === -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import {
      getFirestore, collection, doc, getDoc, updateDoc,
      onSnapshot, orderBy, query, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    // pakai config yang sama dengan index.html (PROYEKMU)
    const config = {
      apiKey: "AIzaSyDL0SlYn5sTMfs_r68-lYIAcd9C7todxdI",
      authDomain: "kantin-c5053.firebaseapp.com",
      projectId: "kantin-c5053",
      storageBucket: "kantin-c5053.firebasestorage.app",
      messagingSenderId: "838998866961",
      appId: "1:838998866961:web:8ca40fc9cf359ec9a045b0"
    };

    const app = initializeApp(config);
    const db  = getFirestore(app);

    // helper: map dokumen Firestore -> format renderOrders()
    function mapOrderDoc(d) {
      const o = d.data() || {};
      const created = o.createdAt?.toDate ? o.createdAt.toDate() : new Date();
      return {
        orderId: d.id,
        timestamp: created,
        studentName:  o.customerName || '-',
        studentClass: o.customerClass || '-',
        items: Array.isArray(o.items) ? o.items.map(it => ({
          name: it.name, quantity: it.quantity, price: it.price, variant: it.variant || null
        })) : [],
        totalPrice: Number(o.total) || 0,
        status: o.status || 'pending'
      };
    }

    // real-time feed
    try {
      const q = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
      onSnapshot(q, (snap) => {
        const orders = snap.docs.map(mapOrderDoc);
        if (window.renderOrders) window.renderOrders(orders);
        if (window.updateStats)  window.updateStats(orders);
        if (window.updateConnectionStatus) window.updateConnectionStatus(true);
      }, (err) => {
        console.error(err);
        if (window.updateConnectionStatus) window.updateConnectionStatus(false);
      });
    } catch (e) {
      console.error(e);
      if (window.updateConnectionStatus) window.updateConnectionStatus(false);
    }

    // override tombol Update Status → siklus pending→processing→ready→completed
    window.updateOrderStatus = async function(orderId){
      try {
        const ref  = doc(db, 'orders', orderId);
        const snap = await getDoc(ref);
        if (!snap.exists()) { alert('Pesanan tidak ditemukan'); return; }
        const cur = snap.data().status || 'pending';
        const next = cur === 'pending' ? 'processing' : cur === 'processing' ? 'ready' : cur === 'ready' ? 'completed' : 'completed';
        await updateDoc(ref, { status: next, statusUpdatedAt: serverTimestamp() });
        if (window.showToast) window.showToast(`Status ${orderId} → ${next}`, 'success');
      } catch (e) {
        console.error(e);
        alert('Gagal update status: ' + e.message);
      }
    };
  </script>
