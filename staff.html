<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Panel - E-Kantin</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; overflow-x: hidden; }

    @keyframes slideIn { from {opacity:0; transform:translateY(10px)} to {opacity:1; transform:translateY(0)} }
    .order-card { animation: slideIn 0.4s ease-out; backdrop-filter: blur(10px); }
    .tab-active { border-bottom: 3px solid #f97316; color: #f97316;
      background: linear-gradient(to bottom, rgba(249,115,22,.05), transparent); }

    /* Animated circles background */
    .circle { position: fixed; border-radius: 50%; background: linear-gradient(135deg, rgba(251,146,60,.15), rgba(249,115,22,.1));
      animation: float 25s infinite ease-in-out; z-index: 0; pointer-events:none; filter: blur(40px); }
    .circle:nth-child(1){ width:400px;height:400px; top:-150px; left:-150px; animation-delay:0s;  animation-duration:30s;}
    .circle:nth-child(2){ width:300px;height:300px; top:40%;  right:-100px; animation-delay:7s;  animation-duration:25s;}
    .circle:nth-child(3){ width:350px;height:350px; bottom:-120px; left:25%; animation-delay:14s; animation-duration:35s;}
    .circle:nth-child(4){ width:250px;height:250px; top:15%; right:25%; animation-delay:21s; animation-duration:28s;}
    @keyframes float {
      0%,100%{ transform:translate(0,0) scale(1);   opacity:.4;}
      33%    { transform:translate(30px,40px) scale(1.05); opacity:.5;}
      66%    { transform:translate(-20px,60px) scale(.95); opacity:.3;}
    }

    main { position: relative; z-index: 1; }
    header { position: relative; z-index: 10; backdrop-filter: blur(10px); background: rgba(255,255,255,.95); }
    .stat-card { transition: all .3s ease; border:1px solid rgba(249,115,22,.1); }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(249,115,22,.15); }
    .glass-card { background: rgba(255,255,255,.9); backdrop-filter: blur(10px); border:1px solid rgba(249,115,22,.1); }
  </style>

  <style>@view-transition { navigation: auto; }</style>
</head>

<body class="bg-gradient-to-br from-gray-50 to-orange-50 font-sans">
  <!-- Animated Background Circles -->
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>

  <!-- Header -->
  <header class="bg-white shadow-lg sticky top-0 z-50 border-b border-orange-100">
    <div class="max-w-7xl mx-auto px-6 py-5">
      <div class="flex justify-between items-center">
        <div class="flex items-center space-x-4">
          <div class="w-12 h-12 bg-gradient-to-br from-orange-500 to-orange-600 rounded-xl flex items-center justify-center shadow-md">
            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-2xl font-bold text-gray-800">Dashboard Staff</h1>
          </div>
        </div>
        <div class="flex items-center space-x-4">
          <div class="text-right">
            <p class="text-sm text-gray-500" id="currentTime"></p>
          </div>
          <button id="btnLogout" class="hidden md:inline-flex bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-2 rounded-lg">
            Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-6">
      <div class="stat-card bg-white rounded-xl shadow-md p-5 hover:shadow-xl transition-all">
        <div class="flex items-start justify-between mb-3">
          <div class="w-10 h-10 bg-yellow-100 rounded-lg flex items-center justify-center">
            <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
        </div>
        <p class="text-sm text-gray-600 font-medium mb-1">Pesanan Baru</p>
        <p id="pendingCount" class="text-3xl font-bold text-gray-800">0</p>
      </div>

      <div class="stat-card bg-white rounded-xl shadow-md p-5 hover:shadow-xl transition-all">
        <div class="flex items-start justify-between mb-3">
          <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
        </div>
        <p class="text-sm text-gray-600 font-medium mb-1">Sedang Diproses</p>
        <p id="processingCount" class="text-3xl font-bold text-gray-800">0</p>
      </div>

      <div class="stat-card bg-white rounded-xl shadow-md p-5 hover:shadow-xl transition-all">
        <div class="flex items-start justify-between mb-3">
          <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
        </div>
        <p class="text-sm text-gray-600 font-medium mb-1">Siap Diambil</p>
        <p id="readyCount" class="text-3xl font-bold text-gray-800">0</p>
      </div>

      <div class="stat-card bg-gradient-to-br from-orange-500 to-orange-600 rounded-xl shadow-md p-5 hover:shadow-xl transition-all">
        <div class="flex items-start justify-between mb-3">
          <div class="w-10 h-10 bg-white bg-opacity-20 rounded-lg flex items-center justify-center">
            <span class="text-white font-bold text-lg">Rp</span>
          </div>
        </div>
        <p class="text-sm text-orange-100 font-medium mb-1">Total Hari Ini</p>
        <p id="totalRevenue" class="text-3xl font-bold text-white">Rp 0</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="glass-card rounded-xl shadow-md mb-6">
      <div class="flex border-b border-gray-200">
        <button onclick="filterOrders('all', this)" id="ordersTab"
          class="filter-btn flex-1 px-6 py-4 font-semibold text-gray-700 hover:bg-gray-50 transition-all tab-active flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          Kelola Pesanan
        </button>
        <button onclick="switchTab('menu')" id="menuTab"
          class="flex-1 px-6 py-4 font-semibold text-gray-700 hover:bg-gray-50 transition-all flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
          Kelola Menu
        </button>
      </div>
    </div>

    <!-- Orders Section -->
    <div id="ordersSection">
      <!-- Filter Buttons -->
      <div class="glass-card rounded-xl shadow-md p-5 mb-6">
        <div class="flex items-center gap-3 mb-3">
          <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
          </svg>
          <span class="text-sm font-semibold text-gray-700">Filter Status</span>
        </div>
        <div class="flex flex-wrap gap-2">
          <button onclick="filterOrders('all', this)" class="filter-btn bg-gradient-to-r from-orange-500 to-orange-600 text-white px-5 py-2.5 rounded-lg font-semibold hover:from-orange-600 hover:to-orange-700 transition-all text-sm shadow-md">Semua</button>
          <button onclick="filterOrders('pending', this)" class="filter-btn bg-white text-gray-700 px-5 py-2.5 rounded-lg font-semibold hover:bg-gray-50 transition-all text-sm border border-gray-200">Baru</button>
          <button onclick="filterOrders('processing', this)" class="filter-btn bg-white text-gray-700 px-5 py-2.5 rounded-lg font-semibold hover:bg-gray-50 transition-all text-sm border border-gray-200">Diproses</button>
          <button onclick="filterOrders('ready', this)" class="filter-btn bg-white text-gray-700 px-5 py-2.5 rounded-lg font-semibold hover:bg-gray-50 transition-all text-sm border border-gray-200">Siap</button>
          <button onclick="filterOrders('completed', this)" class="filter-btn bg-white text-gray-700 px-5 py-2.5 rounded-lg font-semibold hover:bg-gray-50 transition-all text-sm border border-gray-200">Selesai</button>
        </div>
      </div>

      <!-- Orders List -->
      <div id="ordersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Pesanan akan dirender di sini -->
      </div>
    </div>

    <!-- Menu Section (opsional – masih dummy UI) -->
    <div id="menuSection" class="hidden">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="menuList">
        <!-- Item menu (opsional) -->
      </div>
    </div>
  </main>

  <!-- Order Detail Modal -->
  <div id="orderDetailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 max-h-[90%] overflow-y-auto">
      <h2 class="text-2xl font-bold text-gray-800 mb-4">Detail Pesanan</h2>
      <div id="orderDetailContent" class="mb-6"></div>
      <div class="flex gap-3">
        <button onclick="closeOrderDetailModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 py-3 rounded-lg font-semibold transition-colors">
          Tutup
        </button>
      </div>
    </div>
  </div>
  <!-- ===== Firebase + Logic (PART 2/3) ===== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
    import {
      getFirestore, collection, doc, getDoc, updateDoc, onSnapshot,
      query, where, orderBy, serverTimestamp, Timestamp
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

    // === 1) CONFIG (sama dengan index.html kamu) ===
    const firebaseConfig = {
      apiKey: "AIzaSyDL0SlYn5sTMfs_r68-lYIAcd9C7todxdI",
      authDomain: "kantin-c5053.firebaseapp.com",
      projectId: "kantin-c5053",
      storageBucket: "kantin-c5053.firebasestorage.app",
      messagingSenderId: "838998866961",
      appId: "1:838998866961:web:8ca40fc9cf359ec9a045b0"
    };
    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // === 2) Helper mini UI ===
    const $ = (id)=>document.getElementById(id);
    const fmtIDR = (n)=>'Rp ' + (Number(n)||0).toLocaleString('id-ID');

    // Jam header
    function tickTime() {
      const now = new Date();
      $('currentTime').textContent =
        now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})
        + ' - ' +
        now.toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    }
    tickTime(); setInterval(tickTime, 1000);

    // === 3) Auth state (opsional tampilkan email & tombol logout kalau ada) ===
    onAuthStateChanged(auth, (user)=>{
      const btn = $('btnLogout');
      if (user) {
        if (btn) btn.classList.remove('hidden');
      } else {
        if (btn) btn.classList.add('hidden');
      }
    });
    if ($('btnLogout')) $('btnLogout').addEventListener('click', ()=>signOut(auth));

    // === 4) Real-time orders (today) + filter status ===
    let currentFilter = 'all';   // 'all' | 'pending' | 'processing' | 'ready' | 'completed'
    let unsubOrders = null;

    function startOfTodayTS() {
      const d = new Date(); d.setHours(0,0,0,0);
      return Timestamp.fromDate(d);
    }

    function attachOrdersListener() {
      if (unsubOrders) { unsubOrders(); unsubOrders = null; }
      const colRef = collection(db, 'orders');
      const q = query(colRef, where('createdAt','>=', startOfTodayTS()), orderBy('createdAt','desc'));

      unsubOrders = onSnapshot(q, (snap)=>{
        const orders = [];
        snap.forEach(s=>{
          const o = s.data();
          orders.push({
            id: s.id,
            customerName: o.customerName || '-',
            customerClass: o.customerClass || '-',
            status: o.status || 'pending',
            items: Array.isArray(o.items) ? o.items : [],
            total: Number(o.total)||0,
            createdAt: o.createdAt?.toDate ? o.createdAt.toDate() : new Date()
          });
        });
        renderStats(orders);
        renderOrdersGrid(orders);
      }, (err)=>{
        console.error('onSnapshot error:', err);
      });
    }
    attachOrdersListener(); // pasang pertama kali

    // === 5) Render statistik ===
    function renderStats(orders) {
      const pending    = orders.filter(o=>o.status==='pending').length;
      const processing = orders.filter(o=>o.status==='processing').length;
      const ready      = orders.filter(o=>o.status==='ready').length;
      const revenue    = orders.reduce((s,o)=>s+(o.total||0),0);

      $('pendingCount').textContent    = pending;
      $('processingCount').textContent = processing;
      $('readyCount').textContent      = ready;
      $('totalRevenue').textContent    = fmtIDR(revenue);
    }

    // === 6) Render grid pesanan ===
    function renderOrdersGrid(allOrders) {
      const container = $('ordersList');
      container.innerHTML = '';

      const data = (currentFilter==='all') ? allOrders : allOrders.filter(o=>o.status===currentFilter);
      if (data.length===0) {
        container.innerHTML = '<div class="col-span-full text-center py-12"><p class="text-gray-500 text-lg">Tidak ada pesanan</p></div>';
        return;
      }

      const statusText = {
        pending: 'Pesanan Baru',
        processing: 'Sedang Diproses',
        ready: 'Siap Diambil',
        completed: 'Selesai'
      };
      const statusBadge = (s)=>(
        s==='pending'    ? 'bg-yellow-200 text-yellow-800' :
        s==='processing' ? 'bg-blue-200 text-blue-800' :
        s==='ready'      ? 'bg-green-200 text-green-800' :
                           'bg-gray-200 text-gray-800'
      );
      const cardColor = (s)=>(
        s==='pending'    ? 'bg-yellow-50 border-yellow-300' :
        s==='processing' ? 'bg-blue-50 border-blue-300' :
        s==='ready'      ? 'bg-green-50 border-green-300' :
                           'bg-gray-50 border-gray-300'
      );

      data.forEach(o=>{
        const card = document.createElement('div');
        card.className = `order-card border-2 rounded-xl p-4 ${cardColor(o.status)}`;

        const itemsHTML = o.items.map(it =>
          `<div class="text-sm text-gray-700">${it.name}${it.variant?` (${it.variant})`:''} x${it.quantity}</div>`
        ).join('');

        card.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <div>
              <div class="flex items-center space-x-2 mb-1">
                <span class="font-bold text-gray-800">${o.id}</span>
              </div>
              <p class="text-xs text-gray-500">${o.createdAt.toLocaleString('id-ID')}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-semibold ${statusBadge(o.status)}">
              ${statusText[o.status] || o.status}
            </span>
          </div>

          <div class="mb-3">
            <p class="font-semibold text-gray-800">${o.customerName}</p>
            <p class="text-sm text-gray-600">${o.customerClass}</p>
          </div>

          <div class="mb-3 max-h-24 overflow-y-auto">
            ${itemsHTML}
          </div>

          <div class="border-t pt-3 mb-3">
            <div class="flex justify-between items-center">
              <span class="font-semibold text-gray-700">Total:</span>
              <span class="text-xl font-bold text-orange-600">${fmtIDR(o.total)}</span>
            </div>
          </div>

          <div class="flex gap-2">
            ${o.status==='pending'    ? `<button data-id="${o.id}" data-next="processing" class="actBtn flex-1 bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-lg font-semibold text-sm">Proses</button>` : ''}
            ${o.status==='processing' ? `<button data-id="${o.id}" data-next="ready"      class="actBtn flex-1 bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg font-semibold text-sm">Siap</button>`   : ''}
            ${o.status==='ready'      ? `<button data-id="${o.id}" data-next="completed"  class="actBtn flex-1 bg-gray-500 hover:bg-gray-600 text-white py-2 rounded-lg font-semibold text-sm">Selesai</button>` : ''}
            <button data-id="${o.id}" class="detailBtn bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg font-semibold text-sm">Detail</button>
          </div>
        `;
        container.appendChild(card);
      });

      // Bind tombol
      container.querySelectorAll('.actBtn').forEach(btn=>{
        btn.addEventListener('click', ()=> updateOrderStatus(btn.dataset.id, btn.dataset.next));
      });
      container.querySelectorAll('.detailBtn').forEach(btn=>{
        btn.addEventListener('click', ()=> showOrderDetail(btn.dataset.id));
      });
    }

    // === 7) Filter tombol (tidak pakai global `event`) ===
    window.filterOrders = function(status, el){
      currentFilter = status;
      // gaya tombol
      document.querySelectorAll('.filter-btn').forEach(btn=>{
        btn.classList.remove('bg-gradient-to-r','from-orange-500','to-orange-600','text-white','shadow-md');
        btn.classList.add('bg-white','text-gray-700','border','border-gray-200','hover:bg-gray-50');
      });
      if (el) {
        el.classList.remove('bg-white','text-gray-700','border','border-gray-200','hover:bg-gray-50');
        el.classList.add('bg-gradient-to-r','from-orange-500','to-orange-600','text-white','shadow-md');
      }
      // render ulang (data sudah dipegang oleh onSnapshot)
      // panggil render manual dengan cache terakhir? lebih simpel: re-attach snapshot (tetap ringan)
      attachOrdersListener();
    };

    // === 8) Update status ke Firestore ===
    async function updateOrderStatus(orderId, newStatus) {
      try {
        await updateDoc(doc(db, 'orders', orderId), {
          status: newStatus,
          statusUpdatedAt: serverTimestamp()
        });
      } catch (e) {
        alert('Gagal update status (cek login staf & Rules Firestore): ' + e.message);
      }
    }
    window.updateOrderStatus = updateOrderStatus;

    // === 9) Detail order (ambil sekali) ===
    async function showOrderDetail(orderId) {
      const snap = await getDoc(doc(db, 'orders', orderId));
      if (!snap.exists()) return;
      const o = snap.data();

      const itemsHTML = (o.items||[]).map(it => `
        <div class="flex justify-between py-2 border-b">
          <span>${it.name}${it.variant?` (${it.variant})`:''} x${it.quantity}</span>
          <span class="font-semibold">${fmtIDR(it.price*it.quantity)}</span>
        </div>
      `).join('');

      $('orderDetailContent').innerHTML = `
        <div class="space-y-3">
          <div><p class="text-sm text-gray-500">Nomor Pesanan</p><p class="font-bold text-lg">${orderId}</p></div>
          <div><p class="text-sm text-gray-500">Nama Siswa</p><p class="font-semibold">${o.customerName||'-'}</p></div>
          <div><p class="text-sm text-gray-500">Kelas</p><p class="font-semibold">${o.customerClass||'-'}</p></div>
          <div><p class="text-sm text-gray-500">Waktu Pesanan</p><p class="font-semibold">${(o.createdAt?.toDate?o.createdAt.toDate():new Date()).toLocaleString('id-ID')}</p></div>
          <div><p class="text-sm text-gray-500 mb-2">Item Pesanan</p>${itemsHTML}</div>
          <div class="bg-orange-50 rounded-lg p-3">
            <div class="flex justify-between items-center">
              <span class="font-bold text-gray-800">Total Pembayaran:</span>
              <span class="text-2xl font-bold text-orange-600">${fmtIDR(o.total||0)}</span>
            </div>
          </div>
        </div>
      `;
      $('orderDetailModal').classList.remove('hidden');
    }
    window.showOrderDetail = showOrderDetail;
    window.closeOrderDetailModal = ()=>$('orderDetailModal').classList.add('hidden');

    // === 10) Tab dummy (menu tab – opsional) ===
    window.switchTab = function(tab){
      if (tab === 'menu') {
        document.getElementById('ordersSection').classList.add('hidden');
        document.getElementById('menuSection').classList.remove('hidden');
        document.getElementById('ordersTab').classList.remove('tab-active');
        document.getElementById('menuTab').classList.add('tab-active');
      } else {
        document.getElementById('menuSection').classList.add('hidden');
        document.getElementById('ordersSection').classList.remove('hidden');
        document.getElementById('menuTab').classList.remove('tab-active');
        document.getElementById('ordersTab').classList.add('tab-active');
      }
    };
  </script>
  <!-- ===== Utils non-module (PART 3/3) ===== -->
  <script>
    // Tutup modal jika klik overlay di luar card
    document.addEventListener('click', function(e){
      const modal = document.getElementById('orderDetailModal');
      if (!modal) return;
      if (!modal.classList.contains('hidden') && e.target === modal) {
        modal.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
