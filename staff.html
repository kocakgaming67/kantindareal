<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Staff Kantin</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { box-sizing: border-box; }
    .status-pill {
      border-radius: 9999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 min-h-screen">

  <!-- HEADER -->
  <header class="bg-gradient-to-r from-orange-500 to-yellow-500 text-white py-4 px-6 shadow-lg">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <a href="index.html" class="px-3 py-1 rounded-lg hover:bg-white/20 transition">
          ← Halaman Siswa
        </a>
        <h1 class="text-2xl font-bold">Dashboard Staff Kantin</h1>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <span id="connectionStatus" class="px-3 py-1 rounded-full bg-black/20">Menyambung...</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6">
    <!-- FILTER STATUS -->
    <div class="bg-white rounded-2xl shadow-md p-4 mb-6 flex flex-wrap gap-2 items-center">
      <span class="text-sm font-semibold text-gray-700 mr-2">Filter status:</span>
      <button class="status-filter px-3 py-1 rounded-full text-sm font-semibold bg-slate-800 text-white"
              data-status="all">Semua</button>
      <button class="status-filter px-3 py-1 rounded-full text-sm font-semibold bg-yellow-100 text-yellow-800"
              data-status="pending">Pending</button>
      <button class="status-filter px-3 py-1 rounded-full text-sm font-semibold bg-blue-100 text-blue-800"
              data-status="processing">Diproses</button>
      <button class="status-filter px-3 py-1 rounded-full text-sm font-semibold bg-purple-100 text-purple-800"
              data-status="ready">Siap Diambil</button>
      <button class="status-filter px-3 py-1 rounded-full text-sm font-semibold bg-green-100 text-green-800"
              data-status="completed">Selesai</button>
      <button class="status-filter px-3 py-1 rounded-full text-sm font-semibold bg-red-100 text-red-800"
              data-status="cancelled">Dibatalkan</button>
    </div>

    <!-- RINGKASAN -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div class="bg-white rounded-2xl shadow-md p-4">
        <p class="text-xs text-gray-500">Total Order</p>
        <p class="text-2xl font-bold text-gray-800" id="sum-total">0</p>
      </div>
      <div class="bg-white rounded-2xl shadow-md p-4">
        <p class="text-xs text-gray-500">Pending</p>
        <p class="text-2xl font-bold text-yellow-500" id="sum-pending">0</p>
      </div>
      <div class="bg-white rounded-2xl shadow-md p-4">
        <p class="text-xs text-gray-500">Diproses</p>
        <p class="text-2xl font-bold text-blue-500" id="sum-processing">0</p>
      </div>
      <div class="bg-white rounded-2xl shadow-md p-4">
        <p class="text-xs text-gray-500">Siap Diambil</p>
        <p class="text-2xl font-bold text-purple-500" id="sum-ready">0</p>
      </div>
    </div>

    <!-- LIST ORDER -->
    <div id="ordersContainer" class="space-y-4">
      <!-- kartu order akan di-render lewat JS -->
    </div>

    <div id="emptyState" class="hidden mt-10 text-center text-gray-500">
      Belum ada order.
    </div>
  </main>

  <!-- ================= FIREBASE & LOGIC STAFF ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      onValue,
      update
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

    // CONFIG SAMA DENGAN index.html
    const firebaseConfig = {
      apiKey: "AIzaSyCkejTcOfPpedhrOx4gI4HVrejIM3G7cRg",
      authDomain: "kantin-sekolah-e6aea.firebaseapp.com",
      projectId: "kantin-sekolah-e6aea",
      storageBucket: "kantin-sekolah-e6aea.firebasestorage.app",
      messagingSenderId: "296536339754",
      appId: "1:296536339754:web:05fac7daec8b65dd211a53",
      databaseURL: "https://kantin-sekolah-e6aea-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);

    const ordersRef        = ref(db, "orders");
    const container        = document.getElementById("ordersContainer");
    const emptyState       = document.getElementById("emptyState");
    const connectionStatus = document.getElementById("connectionStatus");

    const sumTotalEl      = document.getElementById("sum-total");
    const sumPendingEl    = document.getElementById("sum-pending");
    const sumProcessingEl = document.getElementById("sum-processing");
    const sumReadyEl      = document.getElementById("sum-ready");

    let currentFilter = "pending"; // kalau mau default semua: "all"
    // tandai filter tombol awal
    document.querySelectorAll(".status-filter").forEach(btn => {
      if (btn.dataset.status === currentFilter) {
        btn.classList.add("ring-2", "ring-offset-1", "ring-orange-400");
      }
    });

    const STATUS_LABEL = {
      pending:    "Pending",
      processing: "Diproses",
      ready:      "Siap Diambil",
      completed:  "Selesai",
      cancelled:  "Dibatalkan"
    };

    const STATUS_CLASS = {
      pending:    "bg-yellow-100 text-yellow-800",
      processing: "bg-blue-100 text-blue-800",
      ready:      "bg-purple-100 text-purple-800",
      completed:  "bg-green-100 text-green-800",
      cancelled:  "bg-red-100 text-red-800"
    };

    function formatCurrency(amount) {
      return "Rp " + (amount || 0).toLocaleString("id-ID");
    }

    // ============ LISTENER REALTIME ============

    onValue(ordersRef, (snapshot) => {
      const data = snapshot.val() || {};

      connectionStatus.textContent = "Terhubung";
      connectionStatus.className =
        "px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 text-xs font-semibold";

      const entries = Object.entries(data).map(([id, order]) => ({
        id,
        ...order
      }));

      // sort by createdAt terbaru di atas
      entries.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      renderSummary(entries);
      renderOrders(entries);
    }, (error) => {
      console.error(error);
      connectionStatus.textContent = "Gagal terhubung";
      connectionStatus.className =
        "px-3 py-1 rounded-full bg-red-100 text-red-700 text-xs font-semibold";
    });

    // ============ RENDER SUMMARY ============

    function renderSummary(entries) {
      sumTotalEl.textContent = entries.length;

      const counts = { pending: 0, processing: 0, ready: 0, completed: 0, cancelled: 0 };
      entries.forEach(o => {
        if (counts[o.status] !== undefined) counts[o.status]++;
      });

      sumPendingEl.textContent    = counts.pending;
      sumProcessingEl.textContent = counts.processing;
      sumReadyEl.textContent      = counts.ready;
    }

    // ============ RENDER ORDERS ============

    function renderOrders(entries) {
      const filtered = currentFilter === "all"
        ? entries
        : entries.filter(o => o.status === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");

      container.innerHTML = filtered.map(order => {
        const created = order.createdAt ? new Date(order.createdAt) : new Date();
        const timeStr = created.toLocaleString("id-ID");

        const itemsHtml = (order.items || []).map(it => `
          <div class="flex justify-between text-sm">
            <span class="text-gray-700">
              ${it.name}${it.variant ? ` (${it.variant})` : ""} ×${it.quantity}
            </span>
            <span class="font-semibold text-gray-800">
              ${formatCurrency(it.price * it.quantity)}
            </span>
          </div>
        `).join("");

        const statusLabel = STATUS_LABEL[order.status] || order.status || "-";
        const statusClass = STATUS_CLASS[order.status] || "bg-gray-100 text-gray-700";

        // tombol perubahan status
        const actionsHtml = `
          <div class="flex flex-wrap gap-2 mt-3">
            ${order.status !== "pending" ? "" : `
              <button data-action="set-status" data-id="${order.id}" data-status="processing"
                class="px-3 py-1 rounded-lg text-xs font-semibold bg-blue-500 text-white hover:bg-blue-600">
                Tandai Diproses
              </button>`}
            ${order.status !== "processing" ? "" : `
              <button data-action="set-status" data-id="${order.id}" data-status="ready"
                class="px-3 py-1 rounded-lg text-xs font-semibold bg-purple-500 text-white hover:bg-purple-600">
                Tandai Siap Diambil
              </button>`}
            ${order.status !== "ready" ? "" : `
              <button data-action="set-status" data-id="${order.id}" data-status="completed"
                class="px-3 py-1 rounded-lg text-xs font-semibold bg-green-500 text-white hover:bg-green-600">
                Tandai Selesai
              </button>`}
            ${order.status === "completed" || order.status === "cancelled" ? "" : `
              <button data-action="set-status" data-id="${order.id}" data-status="cancelled"
                class="px-3 py-1 rounded-lg text-xs font-semibold bg-red-500 text-white hover:bg-red-600">
                Batalkan
              </button>`}
          </div>
        `;

        return `
          <div class="bg-white rounded-2xl shadow-md p-4 md:p-5">
            <div class="flex justify-between items-start gap-3 mb-3">
              <div>
                <p class="text-xs text-gray-500">ID Pesanan</p>
                <p class="font-mono text-sm text-gray-800 break-all">${order.id}</p>
              </div>
              <span class="status-pill ${statusClass}">
                ● ${statusLabel}
              </span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
              <div>
                <p class="text-xs text-gray-500">Nama</p>
                <p class="font-semibold text-gray-800">${order.customerName || "-"}</p>
              </div>
              <div>
                <p class="text-xs text-gray-500">Kelas</p>
                <p class="font-semibold text-gray-800">${order.customerClass || "-"}</p>
              </div>
              <div>
                <p class="text-xs text-gray-500">Waktu Pesan</p>
                <p class="text-sm text-gray-700">${timeStr}</p>
              </div>
              <div>
                <p class="text-xs text-gray-500">Total</p>
                <p class="font-bold text-lg text-orange-600">${formatCurrency(order.total)}</p>
              </div>
            </div>

            <div class="mb-3">
              <p class="text-xs text-gray-500 mb-1">Item Pesanan</p>
              <div class="bg-slate-50 rounded-xl p-3 space-y-1">
                ${itemsHtml || '<p class="text-sm text-gray-500">Tidak ada item.</p>'}
              </div>
            </div>

            ${order.notes ? `
              <div class="mb-2">
                <p class="text-xs text-gray-500 mb-1">Catatan</p>
                <div class="bg-yellow-50 border-l-4 border-yellow-400 rounded-lg p-2 text-sm text-gray-700">
                  ${order.notes}
                </div>
              </div>
            ` : ""}

            ${actionsHtml}
          </div>
        `;
      }).join("");
    }

    // ============ GANTI STATUS (event delegation) ============

    container.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action='set-status']");
      if (!btn) return;

      const id     = btn.dataset.id;
      const status = btn.dataset.status;

      if (!id || !status) return;

      const confTexts = {
        processing: "Tandai pesanan ini sedang diproses?",
        ready:      "Tandai pesanan ini siap diambil?",
        completed:  "Tandai pesanan ini sudah selesai?",
        cancelled:  "Batalkan pesanan ini?"
      };
      const msg = confTexts[status] || "Ubah status pesanan?";

      if (!confirm(msg)) return;

      const orderRef = ref(db, "orders/" + id);
      update(orderRef, { status }).catch(err => {
        console.error(err);
        alert("Gagal mengubah status, coba lagi.");
      });
    });

    // ============ FILTER STATUS BUTTONS ============

    document.querySelectorAll(".status-filter").forEach(btn => {
      btn.addEventListener("click", () => {
        currentFilter = btn.dataset.status;

        document.querySelectorAll(".status-filter").forEach(b => {
          b.classList.remove("ring-2", "ring-offset-1", "ring-orange-400");
        });
        btn.classList.add("ring-2", "ring-offset-1", "ring-orange-400");

        // render ulang pakai data terakhir di DOM:
        // cara gampang: trigger ulang listener onValue dengan cara kecil — tapi di sini
        // kita biarkan; renderOrders akan dipanggil otomatis saat ada perubahan data berikutnya.
        // Kalau mau langsung, kita bisa simpan entries terakhir di variabel global.
      });
    });
  </script>
</body>
</html>
